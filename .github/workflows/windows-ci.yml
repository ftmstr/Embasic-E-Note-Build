name: Windows .NET 10 CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: SDK information
        run: dotnet --info
      - name: Restore
        run: dotnet restore Embasic.ENote.slnx
      - name: Build Windows WPF solution
        run: dotnet build Embasic.ENote.slnx --configuration Release --no-restore
      - name: Run storage smoke tests
        run: dotnet run --project tests/Embasic.ENote.SmokeTests/Embasic.ENote.SmokeTests.csproj --configuration Release --no-restore
      - name: Run Windows DPAPI and EMD draft tests
        run: dotnet run --project tests/Embasic.ENote.Emd.Tests/Embasic.ENote.Emd.Tests.csproj --configuration Release --no-restore
      - name: Run Argon2id portable and encrypted-disk negative tests
        run: dotnet run --project tests/Embasic.ENote.Portable.Tests/Embasic.ENote.Portable.Tests.csproj --configuration Release --no-restore
