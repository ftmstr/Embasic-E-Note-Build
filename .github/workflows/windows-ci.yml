name: Windows .NET 10 CI
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: SDK information
        run: dotnet --info
      - name: Restore
        run: dotnet restore Embasic.ENote.slnx
      - name: Build Windows WPF solution
        run: dotnet build Embasic.ENote.slnx --configuration Release --no-restore
      - name: Run Tur33 separate Windows logon and first handles
        shell: pwsh
        run: ./tools/Test-Tur32StartupBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0 -Isolated
      - name: Run Tur33 Windows recipient rotation and rollback gate
        shell: pwsh
        run: ./tools/Test-Tur28ServiceBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0 -Tur33
      - name: Run Tur33 Windows identity and reparse probes
        run: dotnet run --project tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release --no-restore -- tur33-windows-stage
      - name: Run Tur33 selection, backup and operator checks
        run: dotnet run --project tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release --no-restore -- tur33
      - name: Run Tur32 Windows preopened process thread and token boundary
        shell: pwsh
        run: ./tools/Test-Tur32StartupBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0
      - name: Run Tur32 Windows wrapped role and fallback deployment
        shell: pwsh
        run: ./tools/Test-Tur28ServiceBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0 -Tur32
      - name: Run Tur32 midcopy recovery catalog backup and selector
        run: dotnet run --project tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release --no-restore -- tur32
      - name: Run Tur30 Windows software KSP and separate LocalService peer acceptance
        shell: pwsh
        run: ./tools/Test-Tur28ServiceBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0 -CngRotation
      - name: Run Tur31 isolated Windows process, role custody and interrupted deployment checks
        shell: pwsh
        run: ./tools/Test-Tur28ServiceBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0 -Hardened
      - name: Run Tur31 crash, catalog and pin selection tests
        run: dotnet run --project tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release --no-restore -- tur31
      - name: Run Tur31 Windows live file DACL and sharing acceptance
        run: dotnet run --project tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release --no-restore -- tur31-windows-live
      - name: Run storage smoke tests
        run: dotnet run --project tests/Embasic.ENote.SmokeTests/Embasic.ENote.SmokeTests.csproj --configuration Release --no-restore
      - name: Run Windows DPAPI and EMD1 draft tests
        run: dotnet run --project tests/Embasic.ENote.Emd.Tests/Embasic.ENote.Emd.Tests.csproj --configuration Release --no-restore
      - name: Run portable EMD2 and encrypted disk tests
        run: dotnet run --project tests/Embasic.ENote.Portable.Tests/Embasic.ENote.Portable.Tests.csproj --configuration Release --no-restore
      - name: Run recovery backup rotation migration and lock-planning tests
        run: dotnet run --project tests/Embasic.ENote.Security.Tests/Embasic.ENote.Security.Tests.csproj --configuration Release --no-restore
      - name: Run experimental layered encryption lifecycle and recovery-disk tests
        run: dotnet run --project tests/Embasic.ENote.Tur06.Tests/Embasic.ENote.Tur06.Tests.csproj --configuration Release --no-restore
      - name: Run Tur07 encrypted independent layer vault and persistence tests
        run: dotnet run --project tests/Embasic.ENote.Tur07.Tests/Embasic.ENote.Tur07.Tests.csproj --configuration Release --no-restore

      - name: Run Tur08 encrypted workspace ancestry tests
        run: dotnet run --project tests/Embasic.ENote.Tur08.Tests/Embasic.ENote.Tur08.Tests.csproj --configuration Release --no-restore

      - name: Run Tur09 plain Markdown conflict and page layout tests
        run: dotnet run --project tests/Embasic.ENote.Tur09.Tests/Embasic.ENote.Tur09.Tests.csproj --configuration Release --no-restore

      - name: Run Tur10 native RTF copy-only and collision tests
        run: dotnet run --project tests/Embasic.ENote.Tur10.Tests/Embasic.ENote.Tur10.Tests.csproj --configuration Release --no-restore

      - name: Run Tur11 offline DOCX ODT safe-copy and complex-document refusal tests
        run: dotnet run --project tests/Embasic.ENote.Tur11.Tests/Embasic.ENote.Tur11.Tests.csproj --configuration Release --no-restore

      - name: Run Tur12 inert Markdown visual-preview regression tests
        run: dotnet run --project tests/Embasic.ENote.Tur12.Tests/Embasic.ENote.Tur12.Tests.csproj --configuration Release --no-restore

      - name: Run Tur13 inert inline Markdown and table escaping tests
        run: dotnet run --project tests/Embasic.ENote.Tur13.Tests/Embasic.ENote.Tur13.Tests.csproj --configuration Release --no-restore

      - name: Run Tur14 bounded nested Markdown preview tests
        run: dotnet run --project tests/Embasic.ENote.Tur14.Tests/Embasic.ENote.Tur14.Tests.csproj --configuration Release --no-restore

      - name: Run Tur15 bounded triple Markdown and table safety checks
        run: dotnet run --project tests/Embasic.ENote.Tur15.Tests/Embasic.ENote.Tur15.Tests.csproj --configuration Release --no-restore

      - name: Run Tur16 experimental vault snapshot rollback pin tests
        run: dotnet run --project tests/Embasic.ENote.Tur16.Tests/Embasic.ENote.Tur16.Tests.csproj --configuration Release --no-restore

      - name: Run Tur17 fail-closed vault policy gate and OS FileShare tests
        run: dotnet run --project tests/Embasic.ENote.Tur17.Tests/Embasic.ENote.Tur17.Tests.csproj --configuration Release --no-restore

      - name: Run Tur18 bounded ELV1 guarded read and risk tests
        run: dotnet run --project tests/Embasic.ENote.Tur18.Tests/Embasic.ENote.Tur18.Tests.csproj --configuration Release --no-restore

      - name: Run Tur19 experimental vault path policy binding and rollback-risk tests
        run: dotnet run --project tests/Embasic.ENote.Tur19.Tests/Embasic.ENote.Tur19.Tests.csproj --configuration Release --no-restore

      - name: Run Tur20 Windows vault file identity and rollback-risk tests
        run: dotnet run --project tests/Embasic.ENote.Tur20.Tests/Embasic.ENote.Tur20.Tests.csproj --configuration Release --no-restore

      - name: Run Tur21 vault generation recovery and CAS tests
        run: dotnet run --project tests/Embasic.ENote.Tur21.Tests/Embasic.ENote.Tur21.Tests.csproj --configuration Release --no-restore

      - name: Run Tur22 bounded manifest reader and disk staging tests
        run: dotnet run --project tests/Embasic.ENote.Tur22.Tests/Embasic.ENote.Tur22.Tests.csproj --configuration Release --no-restore

      - name: Run Tur23 authenticated retry and Windows key delivery tests
        run: dotnet run --project tests/Embasic.ENote.Tur23.Tests/Embasic.ENote.Tur23.Tests.csproj --configuration Release --no-restore

      - name: Probe Windows TPM capability without provisioning
        shell: powershell
        run: |
          $result = ./tools/Get-VaultAnchorPreflight.ps1
          $probe = $result | ConvertFrom-Json
          if ($probe.probe -ne 'READ_ONLY_TPM_CAPABILITY' -or $probe.independent_anchor_cas -ne 'NOT_RUN') {
            throw 'Invalid TPM preflight output'
          }
          Write-Output $result

      - name: Run Tur24 bound transition, root recovery and rekey tests
        run: dotnet run --project tests/Embasic.ENote.Tur24.Tests/Embasic.ENote.Tur24.Tests.csproj --configuration Release --no-restore

      - name: Run Tur25 vault provider, lifecycle and rekey staging tests
        run: dotnet run --project tests/Embasic.ENote.Tur25.Tests/Embasic.ENote.Tur25.Tests.csproj --configuration Release --no-restore

      - name: Run Tur26 provider identity, bound rekey and recovery race tests
        run: dotnet run --project tests/Embasic.ENote.Tur26.Tests/Embasic.ENote.Tur26.Tests.csproj --configuration Release --no-restore

      - name: Run Tur27 IPC, workspace publication restart and root archive tests
        run: dotnet run --project tests/Embasic.ENote.Tur27.Tests/Embasic.ENote.Tur27.Tests.csproj --configuration Release --no-restore

      - name: Run Tur28 selected reads, recovery and service key tests
        run: dotnet run --project tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release --no-restore

      - name: Run Tur28 disposable Windows service and cross-account ACL acceptance
        shell: pwsh
        run: ./tools/Test-Tur28ServiceBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0

      - name: Run Tur29 multi-generation catalog and independent witness tests
        run: dotnet run --project tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release --no-restore -- tur29

      - name: Run Tur29 dedicated service SID and standard-user acceptance
        shell: pwsh
        run: ./tools/Test-Tur28ServiceBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0 -Dedicated

      - name: Run Tur30 live synchronization, reachability and recovery policy tests
        run: dotnet run --project tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release --no-restore -- tur30

  tur33-native-scm-stop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the test service
        run: dotnet build tests/Embasic.ENote.Tur28.Tests/Embasic.ENote.Tur28.Tests.csproj --configuration Release
      - name: Run strict native SCM STOP and STOP_PENDING acceptance
        shell: pwsh
        run: ./tools/Test-Tur32StartupBoundary.ps1 -HarnessDirectory ./tests/Embasic.ENote.Tur28.Tests/bin/Release/net10.0 -NativeStop
